# Replace kb.example.com and the certificate paths before enabling this site.
# The private channel gateway on 127.0.0.1:8765 must never be proxied here.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name kb.example.com;
    return 301 https://kb.example.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;

    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kb.example.com;

    ssl_certificate /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;

    root /opt/notebook-agent/current/web/dist;
    index index.html;
    client_max_body_size 64k;

    # Default Nginx access logs include query strings. Keep them off until the
    # operator installs a reviewed, query-free log format.
    access_log off;

    # Proxy every /api/* path so an unknown API route remains a JSON 404 and
    # can never fall through to the SPA shell.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_read_timeout 65s;

        include /etc/nginx/snippets/notebook-agent-web-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;

        include /etc/nginx/snippets/notebook-agent-web-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        try_files /index.html =404;

        include /etc/nginx/snippets/notebook-agent-web-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        include /etc/nginx/snippets/notebook-agent-web-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}

apiVersion: v1
kind: Plugin
metadata:
  author: notebook-agent
  name: notebook-knowledge-agent
  repository: local
  version: 0.1.1
  description:
    en_US: Trusted channel bridge for the private knowledge Agent
    zh_Hans: 私有知识库 Agent 的可信渠道桥接
  label:
